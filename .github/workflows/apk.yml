name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "v*.*.*"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 release 和上传文件
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set TAG
        if: github.event_name == 'push'
        run: |
          echo "version=$(echo '${{ github.ref_name }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Set TAG
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "version=$(echo '${{ inputs.version }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          echo ${{ secrets.STORE }} | base64 -d > upload.jks
          echo ${{ secrets.LOCAL }} | base64 -d > local.properties
          chmod +x ./gradlew;
          ./gradlew assembleRelease bundleRelease --stacktrace
          rm upload.jks local.properties

      - name: List build outputs
        run: |
          echo "Listing build outputs..."
          find ${{ env.main_project_module }}/build/outputs -type f -name "*.apk" -o -name "*.aab" || echo "No APK/AAB files found"
          ls -la ${{ env.main_project_module }}/build/outputs/apk/release/ || echo "Release APK directory not found"
          ls -la ${{ env.main_project_module }}/build/outputs/bundle/release/ || echo "Release bundle directory not found"

      - name: Rename APK and AAB files
        run: |
          cd ${{ env.main_project_module }}/build/outputs/apk/release
          for file in *.apk; do
            if [ -f "$file" ]; then
              mv "$file" "sideplay-v${{ env.version }}.apk"
              echo "Renamed $file to sideplay-v${{ env.version }}.apk"
            fi
          done
          cd ../../../bundle/release
          for file in *.aab; do
            if [ -f "$file" ]; then
              mv "$file" "sideplay-v${{ env.version }}.aab"
              echo "Renamed $file to sideplay-v${{ env.version }}.aab"
            fi
          done

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/release/sideplay-v${{ env.version }}.apk
            ${{ env.main_project_module }}/build/outputs/bundle/release/sideplay-v${{ env.version }}.aab
          fail_on_unmatched_files: false